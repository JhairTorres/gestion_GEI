<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ubicaciones</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        /* Estilos para notificaciones */
        .notification {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 5px;
            color: white;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s;
        }
        
        .error {
            background-color: #f44336;
        }
        
        .success {
            background-color: #4CAF50;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; top: 0; }
            to { opacity: 1; top: 20px; }
        }
        
        /* Estilos para el indicador de carga */
        #loading-indicator {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Estilos para la tabla */
        #ubicaciones-table tr:hover {
            background-color: #f5f5f5;
        }
        
        .no-data {
            text-align: center;
            color: #777;
            padding: 20px;
        }
        
        /* Estilos para el modal de confirmación */
        .confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #confirm-yes {
            background-color: #f44336;
            color: white;
        }
        
        #confirm-no {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <button onclick="window.location.href='../admin_dashboard.html'">Volver al Panel</button>
            <button onclick="logout()">Cerrar Sesión</button>
        </nav>

        <h2>Gestión de Ubicaciones</h2>

        <!-- 🔹 Buscar Ubicación por ID -->
        <div class="section">
            <h3>Buscar Ubicación</h3>
            <input type="number" id="searchId" placeholder="ID Ubicación">
            <button onclick="searchUbicacion()">Buscar</button>
        </div>

        <!-- 🔹 Agregar Nueva Ubicación -->
        <div class="section">
            <h3>Agregar Nueva Ubicación</h3>
            <input type="text" id="pais" placeholder="País" required>
            <input type="text" id="region" placeholder="Región" required>
            <input type="text" id="ciudad" placeholder="Ciudad" required>
            <button onclick="saveUbicacion()">Agregar</button>
        </div>

        <!-- 🔹 Actualizar Ubicación por ID -->
        <div class="section">
            <h3>Actualizar Ubicación</h3>
            <input type="number" id="updateId" placeholder="ID Ubicación" required>
            <input type="text" id="updatePais" placeholder="Nuevo País" required>
            <input type="text" id="updateRegion" placeholder="Nueva Región" required>
            <input type="text" id="updateCiudad" placeholder="Nueva Ciudad" required>
            <button onclick="updateUbicacion()">Actualizar</button>
        </div>

        <!-- 🔹 Eliminar Ubicación por ID -->
        <div class="section">
            <h3>Eliminar Ubicación</h3>
            <input type="number" id="deleteId" placeholder="ID Ubicación" required>
            <button onclick="deleteUbicacion()">Eliminar</button>
        </div>

        <!-- 🔹 Tabla de Ubicaciones -->
        <h3>Registros de Ubicaciones</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>País</th>
                    <th>Región</th>
                    <th>Ciudad</th>
                </tr>
            </thead>
            <tbody id="ubicaciones-table"></tbody>
        </table>
    </div>

    <script src="ubicaciones.js"></script>
</body>
</html>
